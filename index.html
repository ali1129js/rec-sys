<!doctype html>
<html lang="en" data-theme="graphite" data-motion="static">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Pick films you like and get recommendations from MovieLens viewer ratings plus a wider all-eras catalogue. Runs entirely in your browser." />
    <meta name="color-scheme" content="light dark" />
    <title>Film Finder – movie recommender</title>
    <script>
      // Apply the saved or system theme and motion before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('rec-sys-theme');
          if (t === 'light') t = 'khaki';
          if (t === 'dark' || t === 'darkgrey') t = 'graphite';
          if (t === 'contrast') t = 'midnight';
          if (t !== 'khaki' && t !== 'graphite' && t !== 'midnight') {
            t = 'graphite';
          }
          document.documentElement.dataset.theme = t;
          var m = localStorage.getItem('rec-sys-motion');
          if (matchMedia('(prefers-reduced-motion: reduce)').matches) m = 'static';
          else if (m !== 'animated') m = 'static';
          document.documentElement.dataset.motion = m;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
